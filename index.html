<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logos/SymbolLogo-removebg-preview.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Make styled QR codes for links, Wi-Fi, contacts and more. Download PNG, JPEG or SVG." />
    <title>QRBuilder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Light by default; dark only if the visitor chose it. Runs before first paint to avoid a flash.
      (function () {
        var theme;
        try { theme = JSON.parse(localStorage.getItem("qrbuilder:theme")); } catch (e) {}
        document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
